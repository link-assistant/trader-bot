[package]
name = "trader-bot"
version = "0.2.0"
edition = "2021"
description = "A configurable trading bot with multi-exchange support, portfolio balancing, scalping strategies, and multi-account management"
readme = "README.md"
license = "Unlicense"
keywords = ["trading", "portfolio", "balancer", "scalping", "crypto", "stocks"]
categories = ["finance", "command-line-utilities"]
repository = "https://github.com/link-assistant/trader-bot"
documentation = "https://github.com/link-assistant/trader-bot"
rust-version = "1.70"

[lib]
name = "trader_bot"
path = "src/lib.rs"

[[bin]]
name = "trader-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
clap = { version = "4.4", features = ["derive", "env"] }

[dev-dependencies]
tokio-test = "0.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some common patterns
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
derive_partial_eq_without_eq = "allow"
redundant_closure_for_method_calls = "allow"
missing_const_for_fn = "allow"
redundant_clone = "allow"
ignored_unit_patterns = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
struct_field_names = "allow"
needless_pass_by_value = "allow"
unnecessary_lazy_evaluations = "allow"
significant_drop_tightening = "allow"
uninlined_format_args = "allow"
unreadable_literal = "allow"
map_unwrap_or = "allow"
or_fun_call = "allow"
derivable_impls = "allow"
unused_self = "allow"
for_kv_map = "allow"
unnecessary_literal_bound = "allow"
return_self_not_must_use = "allow"
must_use_candidate = "allow"
items_after_statements = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
